name: screenshot
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_URL: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ github.event.issue.number }}-${{ github.run_id }}.png
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: npm install

      - run: node main.mjs

      - run: |
          cp screenshot.png "$NAME"
          gh release upload screenshots "$NAME"
          gh issue comment "${{ github.event.issue.number }}" --body "![screenshot](https://github.com/${{ github.repository }}/releases/download/screenshots/$NAME)"
          gh issue close "${{ github.event.issue.number }}"
