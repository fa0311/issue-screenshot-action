name: screenshot
on:
  issues:
    types: [opened, reopened]

permissions:
  contents: write
  issues: write

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_URL: ${{ github.event.issue.title }}
      GH_TOKEN: ${{ github.token }}
      NAME: ${{ github.event.issue.number }}-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm install

      - run: node main.mjs

      - continue-on-error: true
        run: |
          sudo apt-get install -y xvfb
          pip install -U "camoufox[geoip]"
          python -m camoufox fetch
          python camoufox_shot.py

      - run: |
          cp screenshot.png "$NAME-chrome.png"
          gh release upload screenshots "$NAME-chrome.png"
          base="https://github.com/${{ github.repository }}/releases/download/screenshots"
          {
            echo "### chrome"
            echo "![chrome]($base/$NAME-chrome.png)"
            if [ -f camoufox.png ]; then
              cp camoufox.png "$NAME-camoufox.png"
              gh release upload screenshots "$NAME-camoufox.png"
              echo "### camoufox"
              echo "![camoufox]($base/$NAME-camoufox.png)"
            fi
          } > comment.md
          gh issue comment "${{ github.event.issue.number }}" --body-file comment.md
          gh issue close "${{ github.event.issue.number }}"
